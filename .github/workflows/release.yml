name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VER: "3.12"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4

  # release-please rewrites CHANGELOG.md on the release PR; keep the generated README in sync with it.
  update-readme:
    name: Update README on release PR
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release PR
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Render README
        shell: bash
        run: |
          python -m pip install "$(grep -i '^readwright==' requirements-dev.txt)"
          readwright render

      - name: Commit README
        shell: bash
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: render README for release"
          git push

  package-and-release:
    name: Package and Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Stage build files
        id: stage
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/build"
          mkdir -p "$build_dir"

          cp -r src/. "$build_dir/"
          cp data/icon.png "$build_dir/"
          cp data/cast.png "$build_dir/"
          cp data/plugin.json "$build_dir/"
          cp data/SettingsTemplate.yaml "$build_dir/"
          cp LICENSE "$build_dir/"

          site_dir="$build_dir/plugin/site-packages"
          mkdir -p "$site_dir"

          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"
          echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"

      # zeroconf only publishes compiled wheels; build its pure-python fallback and tag it as such.
      - name: Build pure-python zeroconf wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          SKIP_CYTHON=1 python -m pip wheel --no-deps --no-binary zeroconf \
            "$(grep -i '^zeroconf==' requirements.txt)" -w "$RUNNER_TEMP/wheelhouse"
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag any \
            "$RUNNER_TEMP"/wheelhouse/zeroconf-*.whl

      # Pure-python wheels only: the zip is built on Linux but runs on the user's Windows Python.
      - name: Install requirements into plugin/site-packages
        shell: bash
        run: |
          python -m pip install -r requirements.txt --target "${{ steps.stage.outputs.site_dir }}" \
            --only-binary=:all: --implementation py --platform any --python-version 3.11 \
            --find-links "$RUNNER_TEMP/wheelhouse"

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          repo_name="${{ github.event.repository.name }}"
          version="${{ needs.release-please.outputs.version }}"
          zip_name="${repo_name}-${version}.zip"
          zip_path="$RUNNER_TEMP/$zip_name"

          (
            cd "${{ steps.stage.outputs.build_dir }}"
            zip -r "$zip_path" .
          )

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload zip to release
        shell: bash
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.archive.outputs.zip_path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
